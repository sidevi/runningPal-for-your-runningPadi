<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃🏃 RunningPal for your running padi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            /* Fixed the typo here */
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .stats {
            text-align: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .stats-number {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stats-label {
            color: #666;
            font-size: 0.9em;
        }

        .whatsapp-card {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            text-decoration: none;
            transition: transform 0.2s;
        }

        .whatsapp-card:hover {
            transform: translateY(-2px);
        }

        .whatsapp-icon { font-size: 2.5em; }
        .whatsapp-text { flex: 1; }
        .whatsapp-title { color: white; font-weight: 600; }
        .whatsapp-subtitle { color: rgba(255, 255, 255, 0.9); font-size: 0.85em; }
        .whatsapp-button {
            background: white;
            color: #25D366;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏃🏃 Join the Waitlist</h1>
        <p class="subtitle">Be the first to know when we launch!</p>

        <form id="waitlistForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>

            <button type="submit" id="submitBtn">Join Waitlist</button>
        </form>

        <div class="message" id="message"></div>

        <div class="stats">
            <div class="stats-number" id="statsNumber">...</div>
            <div class="stats-label">people on the waitlist</div>
        </div>

        <a href="https://chat.whatsapp.com/EdnMabGqjQhGzQluEhdlcB" target="_blank" class="whatsapp-card">
            <div class="whatsapp-icon">👥</div>
            <div class="whatsapp-text">
                <div class="whatsapp-title">Join our WhatsApp community</div>
                <div class="whatsapp-subtitle">We're here to help</div>
            </div>
            <div class="whatsapp-button">Join</div>
        </a>
   <a href="#" id="shareBtn" class="whatsapp-card" style="background: linear-gradient(135deg, #34B7F1 0%, #075E54 100%); margin-top: 15px;">
    <div class="whatsapp-icon">📢</div>
    <div class="whatsapp-text">
        <div class="whatsapp-title">Invite a running padi</div>
        <div class="whatsapp-subtitle">Share this waitlist on WhatsApp</div>
    </div>
    <div class="whatsapp-button" style="color: #34B7F1;">Share</div>
</a>
   
    </div>

    <script>

        const SCRIPT_URL ='https://script.google.com/macros/s/AKfycbwbDnQvtKVmfvbeIZBawGrjM2dyb96_CT03gtFsbMww5FeLqAFY2VL0UxN88LuySca6pA/exec';

        const form = document.getElementById('waitlistForm');
        const submitBtn = document.getElementById('submitBtn');
        const message = document.getElementById('message');
        const statsNumber = document.getElementById('statsNumber');

        async function loadWaitlistCount() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=count`);
                const data = await response.json();
                statsNumber.textContent = data.count !== undefined ? data.count : '0';
            } catch (error) {
                statsNumber.textContent = '0';
                console.error('Error loading count:', error);
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
            setTimeout(() => { message.style.display = 'none'; }, 5000);
        }

        loadWaitlistCount();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Joining...';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        timestamp: new Date().toISOString()
                    })
                });

                showMessage('🎉 Success! You\'re on the waitlist!', 'success');
                form.reset();
                setTimeout(loadWaitlistCount, 2000);
            } catch (error) {
                showMessage('Something went wrong.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Join Waitlist';
            }
        });
  
  
  // WhatsApp Share Logic
const shareBtn = document.getElementById('shareBtn');

shareBtn.addEventListener('click', (e) => {
    e.preventDefault();
    
    // Customize your message here
    const message = encodeURIComponent(
        "Hey! I just joined the waitlist for RunningPal 🏃‍♂️💨. " +
        "It's going to be the best way to find running partners. " +
        "Join me here: " + window.location.href
    );
    
    const whatsappUrl = `https://wa.me/?text=${message}`;
    window.open(whatsappUrl, '_blank');
});
  
  </script>
</body>
</html>
